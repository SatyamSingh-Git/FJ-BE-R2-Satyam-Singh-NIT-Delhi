{% extends 'base.html' %}

{% block title %}Create Category{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 0 auto;">
    <h1 style="color: white; margin-bottom: 30px;">➕ Create Category</h1>

    <div class="card">
        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label class="form-label">Name *</label>
                <input type="text" name="name" class="form-control" required placeholder="e.g., Groceries">
            </div>

            <div class="form-group">
                <label class="form-label">Type *</label>
                <select name="type" class="form-control" required>
                    <option value="expense">Expense</option>
                    <option value="income">Income</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Icon</label>
                <select name="icon" class="form-control">
                    {% for value, label in icon_choices %}
                    <option value="{{ value }}">{{ value }} {{ label }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Color</label>
                <input type="color" name="color" class="form-control" value="#4F46E5" style="height: 50px;">
            </div>

            <div class="form-group">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control" rows="2"></textarea>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">Create Category</button>
                <a href="{% url 'categories:list' %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
