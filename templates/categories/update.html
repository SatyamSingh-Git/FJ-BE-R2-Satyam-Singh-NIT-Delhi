{% extends 'base.html' %}

{% block title %}Edit {{ category.name }}{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 0 auto;">
    <h1 style="color: white; margin-bottom: 30px;">✏️ Edit {{ category.name }}</h1>

    <div class="card">
        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label class="form-label">Name *</label>
                <input type="text" name="name" class="form-control" value="{{ category.name }}" required>
            </div>

            <div class="form-group">
                <label class="form-label">Icon</label>
                <select name="icon" class="form-control">
                    <option value="📦" {% if category.icon=='📦' %}selected{% endif %}>📦 Default</option>
                    <option value="💰" {% if category.icon=='💰' %}selected{% endif %}>💰 Money</option>
                    <option value="💳" {% if category.icon=='💳' %}selected{% endif %}>💳 Card</option>
                    <option value="🍔" {% if category.icon=='🍔' %}selected{% endif %}>🍔 Food</option>
                    <option value="🚗" {% if category.icon=='🚗' %}selected{% endif %}>🚗 Transport</option>
                    <option value="🛒" {% if category.icon=='🛒' %}selected{% endif %}>🛒 Shopping</option>
                    <option value="🏠" {% if category.icon=='🏠' %}selected{% endif %}>🏠 Home</option>
                    <option value="💊" {% if category.icon=='💊' %}selected{% endif %}>💊 Health</option>
                    <option value="🎮" {% if category.icon=='🎮' %}selected{% endif %}>🎮 Entertainment</option>
                    <option value="📚" {% if category.icon=='📚' %}selected{% endif %}>📚 Education</option>
                    <option value="✈️" {% if category.icon=='✈️' %}selected{% endif %}>✈️ Travel</option>
                    <option value="💼" {% if category.icon=='💼' %}selected{% endif %}>💼 Business</option>
                    <option value="🎁" {% if category.icon=='🎁' %}selected{% endif %}>🎁 Gifts</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Color</label>
                <input type="color" name="color" class="form-control" value="{{ category.color }}"
                    style="height: 50px; padding: 5px;">
            </div>

            <div class="form-group">
                <label class="form-label">Type *</label>
                <select name="type" class="form-control" required>
                    <option value="expense" {% if category.type=='expense' %}selected{% endif %}>Expense</option>
                    <option value="income" {% if category.type=='income' %}selected{% endif %}>Income</option>
                </select>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 30px;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">Save Changes</button>
                <a href="{% url 'categories:list' %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
