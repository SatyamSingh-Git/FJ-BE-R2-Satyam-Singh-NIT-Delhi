{% extends 'base.html' %}

{% block title %}Edit Profile{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 0 auto;">
    <h1 style="color: white; margin-bottom: 30px;">✏️ Edit Profile</h1>

    <div class="card">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="form-group">
                <label class="form-label">First Name</label>
                <input type="text" name="first_name" class="form-control" value="{{ user.first_name }}">
            </div>

            <div class="form-group">
                <label class="form-label">Last Name</label>
                <input type="text" name="last_name" class="form-control" value="{{ user.last_name }}">
            </div>

            <div class="form-group">
                <label class="form-label">Phone</label>
                <input type="tel" name="phone" class="form-control" value="{{ profile.phone }}">
            </div>

            <div class="form-group">
                <label class="form-label">Preferred Currency</label>
                <select name="preferred_currency" class="form-control" id="currency-select">
                    <option value="INR">INR - Indian Rupee</option>
                    <option value="USD">USD - US Dollar</option>
                    <option value="EUR">EUR - Euro</option>
                    <option value="GBP">GBP - British Pound</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Budget Alert Threshold (%)</label>
                <input type="number" name="budget_alert_threshold" class="form-control"
                    value="{{ profile.budget_alert_threshold }}" min="50" max="100">
            </div>

            <div class="form-group">
                <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                    <input type="checkbox" name="email_notifications" style="width: 18px; height: 18px;" {{
                        profile.email_notifications|yesno:"checked," }}>
                    <span>Email Notifications</span>
                </label>
            </div>

            <div class="form-group">
                <label class="form-label">Avatar</label>
                {% if profile.avatar %}
                <img src="{{ profile.avatar.url }}"
                    style="width: 60px; height: 60px; border-radius: 50%; margin-bottom: 10px; display: block;">
                {% endif %}
                <input type="file" name="avatar" class="form-control" accept="image/*">
            </div>

            <div style="display: flex; gap: 10px; margin-top: 30px;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">Save Changes</button>
                <a href="{% url 'accounts:profile' %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        var select = document.getElementById('currency-select');
        var currentValue = '{{ profile.preferred_currency }}';
        if (currentValue) {
            select.value = currentValue;
        }
    });
</script>
{% endblock %}
