{% extends 'base.html' %}

{% block title %}Delete Budget{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 0 auto;">
    <div class="card" style="text-align: center;">
        <h2 style="color: var(--danger); margin-bottom: 20px;">⚠️ Delete Budget?</h2>

        <p style="margin-bottom: 30px;">
            Are you sure you want to delete the budget for <strong>{{ budget.category.icon }} {{ budget.category.name }}</strong>?<br>
            <small style="color: var(--gray);">This will not delete any transactions.</small>
        </p>

        <form method="post" style="display: flex; gap: 10px; justify-content: center;">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, Delete</button>
            <a href="{% url 'budgets:list' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
