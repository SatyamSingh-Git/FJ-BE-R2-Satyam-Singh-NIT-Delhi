{% extends 'base.html' %}

{% block title %}Create Rule{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 0 auto;">
    <h1 style="color: white; margin-bottom: 30px;">➕ Create Categorization Rule</h1>

    <div class="card">
        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label class="form-label">Keyword *</label>
                <input type="text" name="keyword" class="form-control" required placeholder="e.g., Zomato">
            </div>

            <div class="form-group">
                <label class="form-label">Match Type</label>
                <select name="match_type" class="form-control">
                    <option value="contains">Contains</option>
                    <option value="starts">Starts with</option>
                    <option value="exact">Exact match</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Category *</label>
                <select name="category" class="form-control" required>
                    <option value="">Select category</option>
                    {% for cat in categories %}
                    <option value="{{ cat.id }}">{{ cat.icon }} {{ cat.name }} ({{ cat.get_type_display }})</option>
                    {% endfor %}
                </select>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">Create Rule</button>
                <a href="{% url 'bank_import:rules' %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
